{% extends "base.html" %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/crop.css') }}">
<!-- 添加 Cropper.js 的 CSS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-10 text-center">
        <h2 class="section-title">图片裁剪工具</h2>
        <p class="section-subtitle mb-4">自由调整图片尺寸和比例，轻松获得完美构图</p>
        
        <!-- 上传区域 -->
        <div class="upload-container p-4 border rounded mb-4">
            <div class="upload-area" id="dropZone">
                <div class="upload-icon mb-2">
                    <i class="bi bi-cloud-arrow-up display-4"></i>
                </div>
                <p class="mb-3">将图片拖放到这里，或点击上传</p>
                <input type="file" id="fileInput" class="d-none" accept="image/*" multiple>
                <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">
                    选择图片（可多选）
                </button>
            </div>
        </div>

        <!-- 裁剪工作区 -->
        <div id="workspaceContainer" class="d-none">
            <div class="row">
                <!-- 左侧：裁剪区域 -->
                <div class="col-md-8">
                    <div class="card">
                        <div class="card-header bg-transparent">
                            <h5 class="mb-0">裁剪区域</h5>
                        </div>
                        <div class="card-body p-0">
                            <div class="crop-container">
                                <img id="cropImage" class="img-fluid">
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 右侧：控制面板 -->
                <div class="col-md-4">
                    <div class="card">
                        <div class="card-header bg-transparent">
                            <h5 class="mb-0">裁剪选项</h5>
                        </div>
                        <div class="card-body">
                            <!-- 宽高比选择 -->
                            <div class="mb-3">
                                <label class="form-label">宽高比</label>
                                <div class="btn-group w-100" role="group">
                                    <input type="radio" class="btn-check" name="aspectRatio" id="ratio-free" value="NaN" checked>
                                    <label class="btn btn-outline-primary" for="ratio-free">自由</label>
                                    
                                    <input type="radio" class="btn-check" name="aspectRatio" id="ratio-1-1" value="1">
                                    <label class="btn btn-outline-primary" for="ratio-1-1">1:1</label>
                                    
                                    <input type="radio" class="btn-check" name="aspectRatio" id="ratio-4-3" value="1.33333">
                                    <label class="btn btn-outline-primary" for="ratio-4-3">4:3</label>
                                    
                                    <input type="radio" class="btn-check" name="aspectRatio" id="ratio-16-9" value="1.77778">
                                    <label class="btn btn-outline-primary" for="ratio-16-9">16:9</label>
                                </div>
                            </div>

                            <!-- 旋转和翻转 -->
                            <div class="mb-3">
                                <label class="form-label">旋转与翻转</label>
                                <div class="btn-group w-100" role="group">
                                    <button class="btn btn-outline-secondary" id="rotateLeft">
                                        <i class="bi bi-arrow-counterclockwise"></i>
                                    </button>
                                    <button class="btn btn-outline-secondary" id="rotateRight">
                                        <i class="bi bi-arrow-clockwise"></i>
                                    </button>
                                    <button class="btn btn-outline-secondary" id="flipHorizontal">
                                        <i class="bi bi-arrow-left-right"></i>
                                    </button>
                                    <button class="btn btn-outline-secondary" id="flipVertical">
                                        <i class="bi bi-arrow-down-up"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- 缩放控制 -->
                            <div class="mb-3">
                                <label class="form-label">缩放</label>
                                <input type="range" class="form-range" id="zoomRange" min="0.1" max="3" step="0.1" value="1">
                            </div>

                            <!-- 操作按钮 -->
                            <div class="d-grid gap-2">
                                <button class="btn btn-primary" id="cropBtn">
                                    <i class="bi bi-crop me-1"></i>确认裁剪
                                </button>
                                <button class="btn btn-outline-secondary" id="resetBtn">
                                    <i class="bi bi-arrow-counterclockwise me-1"></i>重置
                                </button>
                            </div>

                            <!-- 使用提示 -->
                            <div class="alert alert-info mt-3 mb-0 text-start">
                                <h6 class="alert-heading d-flex align-items-center">
                                    <i class="bi bi-info-circle me-2"></i>使用提示
                                </h6>
                                <hr class="my-2">
                                <ul class="mb-0 ps-4 small">
                                    <li class="mb-1">拖动或调整裁剪框以选择区域</li>
                                    <li class="mb-1">可以选择固定宽高比进行裁剪</li>
                                    <li class="mb-1">使用旋转和翻转按钮调整图片方向</li>
                                    <li class="mb-1">使用缩放滑块调整图片大小</li>
                                    <li class="text-primary fw-bold">点击"确认裁剪"后才可以下载处理后的图片</li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 图片导航 -->
            <div class="image-navigation mt-3 d-none">
                <div class="d-flex justify-content-center align-items-center gap-3">
                    <button class="btn btn-outline-primary" id="prevButton">
                        <i class="bi bi-chevron-left"></i> 上一张
                    </button>
                    <span id="imageCounter" class="text-muted">1/1</span>
                    <button class="btn btn-outline-primary" id="nextButton">
                        下一张 <i class="bi bi-chevron-right"></i>
                    </button>
                </div>
            </div>

            <!-- 下载按钮 -->
            <div class="mt-3">
                <button id="downloadBtn" class="btn btn-success d-none">
                    <i class="bi bi-download me-1"></i>下载图片
                </button>
                <button id="downloadAllBtn" class="btn btn-success d-none">
                    <i class="bi bi-download me-1"></i>打包下载
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<!-- 添加 Cropper.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
<script src="{{ url_for('static', filename='js/jszip.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/crop.js') }}"></script>
{% endblock %}
