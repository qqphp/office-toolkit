{% extends "base.html" %}

{% block content %}
<!-- 调试信息容器 -->
<div id="debugInfo" class="alert alert-info alert-dismissible fade d-none" role="alert">
    <span class="message"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>

<div class="row justify-content-center">
    <div class="col-md-8 text-center">
        <h2 class="section-title">PDF加密工具</h2>
        
        <!-- 添加提示信息 -->
        <div class="alert alert-info mb-4" role="alert">
            <h5 class="alert-heading"><i class="bi bi-info-circle me-2"></i>使用说明</h5>
            <p class="mb-1">✨ 选择或拖拽PDF文件，设置密码后我们会为您的PDF添加加密保护</p>
            <p class="mb-0"><i class="bi bi-shield-check me-1"></i>所有处理都在服务器完成，文件会在处理后立即删除，请放心使用</p>
        </div>

        <div class="upload-container p-4 border rounded mb-5">
            <div class="pdf-upload-area" id="pdfDropZone">
                <i class="bi bi-file-earmark-lock display-4"></i>
                <p class="mb-3">将PDF文件拖放到这里，或点击上传</p>
                <input type="file" id="pdfFileInput" class="d-none" accept=".pdf">
                <button class="btn btn-primary" onclick="document.getElementById('pdfFileInput').click()">
                    <i class="bi bi-file-earmark-pdf me-1"></i>选择PDF文件
                </button>
            </div>
            
            <!-- 密码输入区域 -->
            <div id="passwordContainer" class="mt-4 d-none">
                <div class="row justify-content-center">
                    <div class="col-md-6">
                        <div class="form-floating mb-2">
                            <input type="password" 
                                   class="form-control" 
                                   id="passwordInput" 
                                   placeholder="设置PDF密码" 
                                   minlength="4"
                                   maxlength="32"
                                   pattern=".{4,32}"
                                   required>
                            <label for="passwordInput">设置PDF密码</label>
                        </div>
                        <div class="password-requirements text-muted small mb-3">
                            <i class="bi bi-info-circle me-1"></i>密码长度要求：4-32个字符
                        </div>
                        <button class="btn btn-primary" id="encryptBtn" disabled>
                            <i class="bi bi-lock me-1"></i>加密并下载
                        </button>
                    </div>
                </div>
            </div>
            
            <div id="progressContainer" class="progress-section mt-4 d-none">
                <div class="card">
                    <div class="card-body">
                        <h6 class="card-subtitle mb-3 text-muted">处理进度</h6>
                        <div class="progress">
                            <div id="progressBar" 
                                 class="progress-bar progress-bar-striped progress-bar-animated" 
                                 role="progressbar" style="width: 0%" 
                                 aria-valuenow="0" 
                                 aria-valuemin="0" 
                                 aria-valuemax="100">
                            </div>
                        </div>
                        <div id="progressText" class="text-center mt-2">
                            <span class="badge bg-primary">准备处理...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/pdf.css') }}">
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/pdf_encrypt.js') }}"></script>
{% endblock %}
