<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ get_page_meta('title') }}</title>
    <meta name="description" content="{{ get_page_meta('description') }}">
    <meta name="keywords" content="{{ get_page_meta('keywords') }}">
    <meta name="google-site-verification" content="GHQLRe44tvDN2ymQACyAHNozWD1-ZlzuOcijM3ILWQ8" />
    <meta name="baidu-site-verification" content="codeva-sBYeJGKj6Z" />
    <meta name="360-site-verification" content="0bdb58e59ae0e840d8901defdf594a8c" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-PRHW2JX30H"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-PRHW2JX30H');
    </script>

    {{ bootstrap.load_css() }}
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/office-toolkit.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap-icons.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('main.home') }}">
                <img src="{{ url_for('static', filename='images/office-toolkit.svg') }}"
                     alt="" width="40" height="40">
                <span>办公助手</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link {{ 'active' if request.endpoint == 'main.home' }}" 
                           href="{{ url_for('main.home') }}">
                            <i class="bi bi-house-door me-1"></i>首页
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {{ 'active' if request.endpoint == 'main.index' }}" 
                           href="{{ url_for('main.index') }}">
                            <i class="bi bi-image me-1"></i>透明背景
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {{ 'active' if request.endpoint == 'main.convert_pdf' }}" 
                           href="{{ url_for('main.convert_pdf') }}">
                            <i class="bi bi-file-pdf me-1"></i>图片转PDF
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {{ 'active' if request.endpoint == 'main.watermark' }}" 
                           href="{{ url_for('main.watermark') }}">
                            <i class="bi bi-water me-1"></i>图片水印
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {{ 'active' if request.endpoint == 'main.compress' }}" 
                           href="{{ url_for('main.compress') }}">
                            <i class="bi bi-file-zip me-1"></i>图片压缩
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {{ 'active' if request.endpoint == 'main.blur_face' }}" 
                           href="{{ url_for('main.blur_face') }}">
                            <i class="bi bi-person-bounding-box me-1"></i>模糊面部
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {{ 'active' if request.endpoint == 'main.crop' }}" 
                           href="{{ url_for('main.crop') }}">
                            <i class="bi bi-crop me-1"></i>图片裁剪
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {{ 'active' if request.endpoint == 'pdf_to_word.pdf_to_word_page' }}" 
                           href="{{ url_for('pdf_to_word.pdf_to_word_page') }}">
                            <i class="bi bi-file-earmark-word me-1"></i>PDF转Word
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {{ 'active' if request.endpoint == 'pdf_encrypt.pdf_encrypt_page' }}" 
                           href="{{ url_for('pdf_encrypt.pdf_encrypt_page') }}">
                            <i class="bi bi-file-earmark-lock me-1"></i>PDF加密
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 添加一个小间距 -->
    <div class="mb-3"></div>

    <main class="container my-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer mt-auto py-4 bg-light">
        <nav class="container footer-links" aria-label="相关链接">
            <a href="https://qqphp.com" target="_blank" rel="noopener noreferrer" class="footer-link">
                <i class="bi bi-journal-text" aria-hidden="true"></i>
                <span>技术博客</span>
            </a>
            <a href="https://github.com/qqphp/office-toolkit" target="_blank" rel="noopener noreferrer" class="footer-link">
                <i class="bi bi-github" aria-hidden="true"></i>
                <span>开源地址</span>
            </a>
        </nav>
    </footer>

    {{ bootstrap.load_js() }}
    {% block extra_js %}{% endblock %}
</body>
</html>
