<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ get_page_meta('title') }}</title>
    <meta name="description" content="{{ get_page_meta('description') }}">
    <meta name="keywords" content="{{ get_page_meta('keywords') }}">
    {{ bootstrap.load_css() }}
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap-icons.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('main.home') }}">
                <img src="{{ url_for('static', filename='images/logo.png') }}" 
                     alt="青石图片工具箱" 
                     height="40" 
                     class="d-inline-block align-text-top">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link {{ 'active' if request.endpoint == 'main.home' }}" 
                           href="{{ url_for('main.home') }}">
                            <i class="bi bi-house-door me-1"></i>首页
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {{ 'active' if request.endpoint == 'main.index' }}" 
                           href="{{ url_for('main.index') }}">
                            <i class="bi bi-image me-1"></i>透明背景
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {{ 'active' if request.endpoint == 'main.convert_pdf' }}" 
                           href="{{ url_for('main.convert_pdf') }}">
                            <i class="bi bi-file-pdf me-1"></i>图片转PDF
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {{ 'active' if request.endpoint == 'main.watermark' }}" 
                           href="{{ url_for('main.watermark') }}">
                            <i class="bi bi-water me-1"></i>图片水印
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {{ 'active' if request.endpoint == 'main.compress' }}" 
                           href="{{ url_for('main.compress') }}">
                            <i class="bi bi-file-zip me-1"></i>图片压缩
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {{ 'active' if request.endpoint == 'main.blur_face' }}" 
                           href="{{ url_for('main.blur_face') }}">
                            <i class="bi bi-person-bounding-box me-1"></i>模糊面部
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 添加一个小间距 -->
    <div class="mb-3"></div>

    <main class="container my-4">
        {% block content %}{% endblock %}
    </main>

    {{ bootstrap.load_js() }}
    {% block extra_js %}{% endblock %}
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
