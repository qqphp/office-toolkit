{% extends "base.html" %}

{% block content %}
<div class="error-page text-center py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <!-- 404图标 -->
                <div class="error-icon mb-4">
                    <i class="bi bi-exclamation-circle display-1 text-primary"></i>
                </div>
                
                <!-- 错误标题 -->
                <h1 class="section-title mb-3">页面未找到</h1>
                
                <!-- 错误描述 -->
                <p class="section-subtitle mb-4">
                    抱歉，您访问的页面不存在或已被移除。
                </p>
                
                <!-- 返回按钮 -->
                <div class="d-flex justify-content-center gap-3">
                    <a href="{{ url_for('main.home') }}" class="btn btn-primary btn-lg px-4">
                        <i class="bi bi-house-door me-2"></i>返回首页
                    </a>
                    <button onclick="history.back()" class="btn btn-outline-primary btn-lg px-4">
                        <i class="bi bi-arrow-left me-2"></i>返回上页
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
