{% extends "base.html" %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/blur_face.css') }}">
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 text-center">
        <h2 class="section-title">图片面部模糊处理工具</h2>
        <div class="upload-container p-4 border rounded mb-5">
            <div class="upload-area" id="dropZone">
                <div class="upload-icon mb-2">
                    <i class="bi bi-cloud-arrow-up display-4"></i>
                </div>
                <p class="mb-3">将图片拖放到这里，或点击上传</p>
                <input type="file" id="fileInput" class="d-none" accept="image/*" multiple>
                <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">
                    选择图片（可多选）
                </button>
            </div>
            
            <!-- 进度条 -->
            <div id="progressContainer" class="progress-section mt-4 d-none">
                <div class="card">
                    <div class="card-body">
                        <h6 class="card-subtitle mb-3 text-muted">处理进度</h6>
                        <div class="progress">
                            <div id="progressBar" 
                                 class="progress-bar progress-bar-striped progress-bar-animated" 
                                 role="progressbar" style="width: 0%" 
                                 aria-valuenow="0" 
                                 aria-valuemin="0" 
                                 aria-valuemax="100">
                            </div>
                        </div>
                        <div id="progressText" class="text-center mt-2">
                            <span class="badge bg-primary">准备处理...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 预览区域 -->
        <div id="previewContainer" class="mt-4 d-none">
            <div class="row">
                <div class="col-md-6">
                    <div class="card h-100">
                        <div class="card-header bg-transparent">
                            <h5 class="mb-0">原图</h5>
                        </div>
                        <div class="card-body">
                            <div class="preview-box original-preview-container">
                                <img id="originalPreview" class="img-fluid">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card h-100">
                        <div class="card-header bg-transparent">
                            <h5 class="mb-0">处理结果</h5>
                        </div>
                        <div class="card-body">
                            <div class="preview-box" id="resultContainer">
                                <img id="resultPreview" class="img-fluid">
                            </div>
                        </div>
                        <div class="card-footer bg-transparent">
                            <button id="downloadBtn" class="btn btn-success d-none">
                                <i class="bi bi-download me-1"></i>下载图片
                            </button>
                            <button id="downloadAllBtn" class="btn btn-success d-none">
                                <i class="bi bi-download me-1"></i>打包下载
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- 图片导航 -->
            <div class="image-navigation mt-3 d-none">
                <div class="d-flex justify-content-center align-items-center gap-3">
                    <button class="btn btn-outline-primary" id="prevButton">
                        <i class="bi bi-chevron-left"></i> 上一张
                    </button>
                    <span id="imageCounter" class="text-muted">1/1</span>
                    <button class="btn btn-outline-primary" id="nextButton">
                        下一张 <i class="bi bi-chevron-right"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/jszip.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/blur_face.js') }}"></script>
{% endblock %}
