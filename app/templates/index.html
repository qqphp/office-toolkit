{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 text-center">
        <h1 class="mb-4">图片背景透明处理工具</h1>
        <div class="upload-container p-5 border rounded">
            <div class="upload-area" id="dropZone">
                <p class="mb-3">将图片拖放到这里，或点击上传</p>
                <input type="file" id="fileInput" class="d-none" accept="image/*" multiple>
                <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">
                    选择图片（可多选）
                </button>
            </div>
            
            <div id="previewContainer" class="mt-4 d-none">
                <div class="row">
                    <div class="col-md-6">
                        <h5>原图</h5>
                        <div class="preview-box original-preview-container">
                            <img id="originalPreview" class="img-fluid">
                        </div>
                        <div class="mt-2 text-center image-navigation d-none">
                            <button class="btn btn-sm btn-outline-primary" id="prevOriginal">上一张</button>
                            <span id="imageCounter" class="mx-2">1/1</span>
                            <button class="btn btn-sm btn-outline-primary" id="nextOriginal">下一张</button>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <h5>处理结果</h5>
                        <div class="preview-box transparent-bg-container">
                            <img id="resultPreview" class="img-fluid">
                        </div>
                    </div>
                </div>
                <div class="mt-3 text-center">
                    <button id="downloadBtn" class="btn btn-success me-2 d-none">
                        下载当前图片
                    </button>
                    <button id="downloadAllBtn" class="btn btn-primary d-none">
                        下载所有图片
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
