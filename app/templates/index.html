{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 text-center">
        <h1 class="mb-4">图片背景透明处理工具</h1>
        <div class="upload-container p-5 border rounded mb-5">
            <div class="upload-area" id="dropZone">
                <p class="mb-3">将图片拖放到这里，或点击上传</p>
                <input type="file" id="fileInput" class="d-none" accept="image/*" multiple>
                <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">
                    选择图片（可多选）
                </button>
            </div>
            
            <div id="progressContainer" class="progress-section mt-4 d-none">
                <div class="card">
                    <div class="card-body">
                        <h6 class="card-subtitle mb-3 text-muted">处理进度</h6>
                        <div class="progress">
                            <div id="progressBar" 
                                 class="progress-bar progress-bar-striped progress-bar-animated" 
                                 role="progressbar" style="width: 0%" 
                                 aria-valuenow="0" 
                                 aria-valuemin="0" 
                                 aria-valuemax="100">
                            </div>
                        </div>
                        <div id="progressText" class="text-center mt-2">
                            <span class="badge bg-primary">正在处理图片...</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <div id="previewContainer" class="mt-4 d-none">
                <div class="row">
                    <div class="col-md-6">
                        <div class="card h-100">
                            <div class="card-header bg-transparent">
                                <h5 class="mb-0">原图</h5>
                            </div>
                            <div class="card-body">
                                <div class="preview-box original-preview-container">
                                    <img id="originalPreview" class="img-fluid">
                                </div>
                            </div>
                            <div class="card-footer bg-transparent">
                                <div class="image-navigation d-none">
                                    <button class="btn btn-sm btn-outline-primary" id="prevOriginal">上一张</button>
                                    <span id="imageCounter" class="mx-2">1/1</span>
                                    <button class="btn btn-sm btn-outline-primary" id="nextOriginal">下一张</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card h-100">
                            <div class="card-header bg-transparent">
                                <h5 class="mb-0">处理结果</h5>
                            </div>
                            <div class="card-body">
                                <div class="preview-box transparent-bg-container" id="resultContainer">
                                    <img id="resultPreview" class="img-fluid">
                                </div>
                            </div>
                            <div class="card-footer bg-transparent">
                                <div class="bg-color-selector">
                                    <div class="d-flex flex-column align-items-center gap-3">
                                        <div class="preset-colors">
                                            <label class="d-block mb-2 text-muted">预设背景:</label>
                                            <div class="color-presets d-flex flex-wrap justify-content-center gap-2">
                                                <button class="color-btn active" data-color="transparent" title="透明背景">
                                                    <i class="bi bi-border"></i>
                                                </button>
                                                <button class="color-btn" data-color="#FFFFFF" style="background-color: #FFFFFF;" title="白色"></button>
                                                <button class="color-btn" data-color="#000000" style="background-color: #000000;" title="黑色"></button>
                                                <button class="color-btn" data-color="#FF0000" style="background-color: #FF0000;" title="红色"></button>
                                                <button class="color-btn" data-color="#0000FF" style="background-color: #0000FF;" title="蓝色"></button>
                                            </div>
                                        </div>
                                        <div class="custom-color-picker text-center">
                                            <label class="d-block mb-2 text-muted">自定义背景:</label>
                                            <input type="color" id="customColorPicker" class="form-control form-control-color mx-auto" title="选择自定义颜色">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="card mt-4">
                    <div class="card-body">
                        <div class="d-flex flex-wrap justify-content-center gap-3">
                            <button id="downloadBtn" class="btn btn-success d-none">
                                <i class="bi bi-download me-1"></i>下载当前图片
                            </button>
                            <button id="downloadAllBtn" class="btn btn-primary d-none">
                                <i class="bi bi-file-earmark-zip me-1"></i>打包下载全部
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="features-section mb-5">
            <h2 class="display-5 mb-3">移除人物背景</h2>
            <p class="lead text-muted mb-5">一款神奇的背景去除器，具有出色的抠图质量和令人惊叹的边缘细节</p>

            <div class="category-selector mb-4">
                <div class="btn-group" role="group">
                    <button type="button" class="btn btn-outline-primary active" data-category="people">人物</button>
                    <button type="button" class="btn btn-outline-primary" data-category="plants">植物</button>
                    <button type="button" class="btn btn-outline-primary" data-category="animals">动物</button>
                    <button type="button" class="btn btn-outline-primary" data-category="sky">天空</button>
                    <button type="button" class="btn btn-outline-primary" data-category="food">食物</button>
                    <button type="button" class="btn btn-outline-primary" data-category="vehicles">车辆</button>
                    <button type="button" class="btn btn-outline-primary" data-category="graphics">图形</button>
                    <button type="button" class="btn btn-outline-primary" data-category="icons">图标</button>
                    <button type="button" class="btn btn-outline-primary" data-category="symbols">符号</button>
                </div>
            </div>

            <div class="examples-container">
                <div class="row g-4">
                    <div class="col-md-6">
                        <div class="card h-100">
                            <div class="card-header bg-transparent border-0">
                                <h5 class="mb-0">原图</h5>
                            </div>
                            <div class="card-body d-flex align-items-center justify-content-center">
                                <img id="exampleOriginal" class="img-fluid rounded example-img" src="" alt="原始图片示例">
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card h-100">
                            <div class="card-header bg-transparent border-0">
                                <h5 class="mb-0">处理效果</h5>
                            </div>
                            <div class="card-body d-flex align-items-center justify-content-center transparent-bg">
                                <img id="exampleProcessed" class="img-fluid rounded example-img" src="" alt="处理后图片示例">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
