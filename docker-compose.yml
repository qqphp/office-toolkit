version: '3.8'

services:
  web:
    build: .
    container_name: image_processing_app
    ports:
      - "5001:5001"
    volumes:
      # 持久化上传的文件
      - upload_data:/app/app/static/uploads
      # 持久化模型文件
      - model_data:/app/app/models
      # 挂载静态文件，便于开发时实时更新
      - ./app/static:/app/app/static
    environment:
      - SECRET_KEY=img_tools_secret_key
      # 如果需要在生产环境中使用其他配置，可以在这里添加
    restart: unless-stopped

volumes:
  upload_data:
    name: image_processing_upload_data
  model_data:
    name: image_processing_model_data 